name: Build Check

on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      # 🔴 resx 的「鍵存在但值為空」是崩潰級缺陷,不是風格問題:
      #    ResourceManager 回 "" 而**不會** fallback → ImGui 拿到零長度 span →
      #    fixed 取指標為 null → igFindRenderedTextEnd 從位址 0 掃 → C0000005。
      #    「鍵不存在」反而安全(會正常退回中性資源)。
      #    上游 crowdin 的 "New translations *.resx" 合併會把這種地雷帶回來,
      #    所以擋在建置之前。腳本純標準函式庫、自帶校準閘門(G1~G7)。
      - name: Check resx empty values
        shell: pwsh
        run: '& "C:/Program Files/Python313/python.exe" .github/scripts/check_resx_empty.py'
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.x
            10.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          $pin = 'D:\ffxiv-tc-port\dalamud-pins\dalamud-pin-v13.0.0.17\dalamud-api13-net9.zip'
          if (-not (Test-Path -LiteralPath $pin)) { throw "pinned Dalamud not found on this runner: $pin" }
          Copy-Item -LiteralPath $pin -Destination dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:RUNNER_TEMP\dalamud-pinned\"
      - name: Build with dotnet
        run: dotnet build --configuration Release SubmarineTracker/SubmarineTracker.csproj -p:DalamudLibPath="$env:RUNNER_TEMP\dalamud-pinned\"
# workflow re-registration trigger 2026-10-26T18:45:01Z
